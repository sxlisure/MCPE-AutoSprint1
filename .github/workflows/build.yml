name: Build MCPE AutoSprint EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pygame pyinstaller

      - name: Build Windows x64 EXE
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --collect-all pygame --name MCPE_AutoSprint autosprint.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MCPE-AutoSprint-Windows-x64
          path: dist/MCPE_AutoSprint.exe
          if-no-files-found: error
          retention-days: 14
